# Generated by tools/build.py from theme.toml. Do not edit by hand.
# Source with: source-file ~/.config/tmux/myeyes.conf

set-option -g status-style "fg=#3c4a4f,bg=#f3ecda"
set-window-option -g window-status-style "fg=#596d73,bg=default"
set-window-option -g window-status-current-style "fg=#a62d66,bg=default,bold"
set-window-option -g window-status-activity-style "fg=#a43f0b,bg=default"
set-window-option -g window-status-bell-style "fg=#fcf6e6,bg=#ae2e2a"

set-option -g pane-border-style "fg=#d6cdb9"
set-option -g pane-active-border-style "fg=#809091"

set-option -g message-style "fg=#071418,bg=#e9e1cb"
set-option -g message-command-style "fg=#071418,bg=#e9e1cb"

set-option -g display-panes-active-colour "#a62d66"
set-option -g display-panes-colour "#596d73"
set-window-option -g clock-mode-colour "#0b67a9"

# Faint text (SGR 2). Windows Terminal renders faint by halving the colour's
# brightness, which on a light background makes near-black text *darker*, so
# faint and normal text look identical (e.g. Claude Code's ghost suggestions).
# tmux emits faint via the terminfo `dim` capability, so for the terminal type
# Windows Terminal reports we redefine `dim` as "set foreground to the muted
# grey". Text with its own colour sets it after this and keeps that colour;
# default-coloured faint text renders muted. Alacritty has a native dim
# palette (see its theme), so it's left alone.
set-option -as terminal-overrides ',xterm-256color:dim=\E[38;2;89;109;115m'

# Copy-mode selection and search matches.
set-window-option -g mode-style "fg=#071418,bg=#e9e1cb"
set-window-option -g copy-mode-match-style "bg=#faeac6"
set-window-option -g copy-mode-current-match-style "bg=#f2cf94"
